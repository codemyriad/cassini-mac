name: Cassini
options:
  bundleIdPrefix: io.codemyriad.cassini
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    CASSINI_APP_HARDENED_RUNTIME: YES
    CASSINI_UPDATE_FEED: https://gocassini.com/PLACEHOLDER/mac/appcast.xml
    CASSINI_UPDATES_ENABLED: NO
    SWIFT_STRICT_CONCURRENCY: targeted
    CASSINI_STORE_LISTING_PUBLIC: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  CassiniKit:
    path: .
targets:
  Cassini:
    type: application
    platform: macOS
    sources:
      - path: Cassini
        excludes:
          - "Info.plist"
          - "Cassini.entitlements"
          - "Resources"
      - path: Cassini/Assets.xcassets
        buildPhase: resources
      - path: Cassini/Resources/Cassini.html
        buildPhase: resources
      - path: Cassini/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Cassini/Resources/UX
        type: folder
        buildPhase: resources
      - path: UITests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
        embed: true
        codeSign: false
      - package: CassiniKit
        product: CassiniKit
      - package: CassiniKit
        product: CassiniLibrary
      - package: CassiniKit
        product: CassiniLibraryWatchers
      - package: CassiniKit
        product: CassiniPlayback
      - package: CassiniKit
        product: CassiniWhistle
      - package: CassiniKit
        product: CassiniTranscription
      - package: CassiniKit
        product: CassiniRecording
      - package: CassiniKit
        product: CassiniBrowserControl
      - package: CassiniKit
        product: CassiniBrowserSetup
      - package: CassiniKit
        product: CassiniExport
      - package: CassiniKit
        product: CassiniModels
      - package: CassiniKit
        product: CassiniParakeet
      - package: CassiniKit
        product: CassiniSearch
      - target: CassiniModelDownloads
        embed: true
      - target: CassiniBrowserSetup
        embed: true
      - target: CassiniQuickLook
      - target: CassiniBrowserHost
        link: false
        embed: false
      - target: CassiniControlHost
        link: false
        embed: false
      - target: CassiniWhistleWorker
        link: false
        embed: false
      - target: CassiniParakeetWorker
        link: false
        embed: false
    postBuildScripts:
      - name: Bundle reviewed browser companion
        basedOnDependencyAnalysis: false
        script: python3 "$SRCROOT/scripts/bundle-browser-companion.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BrowserCompanion"
      - name: Bundle pinned Opus encoder
        script: bash "$SRCROOT/scripts/bundle-opus.sh"
        basedOnDependencyAnalysis: false
      - name: Bundle native messaging host
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          cp "$BUILT_PRODUCTS_DIR/cassini-browser-host" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/cassini-browser-host"
          cp "$BUILT_PRODUCTS_DIR/cassini-control-host" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/cassini-control-host"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/cassini-browser-host"
          - "$(BUILT_PRODUCTS_DIR)/cassini-control-host"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/cassini-browser-host"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/cassini-control-host"
      - name: Bundle pinned Whistle worker and engine
        script: bash "$SRCROOT/scripts/bundle-whistle.sh"
        basedOnDependencyAnalysis: false
      - name: Bundle pinned Parakeet runtime and worker
        script: bash "$SRCROOT/scripts/bundle-parakeet.sh"
        basedOnDependencyAnalysis: false
      - name: Sign Sparkle nested helpers
        script: bash "$SRCROOT/scripts/sign-sparkle.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Cassini/Info.plist
      properties:
        SUFeedURL: "$(CASSINI_UPDATE_FEED)"
        CassiniUpdatesEnabled: "$(CASSINI_UPDATES_ENABLED)"
        SUPublicEDKey: C/yBLLXnCHyydg2/EBmbuSC8ijeLtnga8VX/lCSUEiY=
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUShowReleaseNotes: false
        SUEnableSystemProfiling: false
        CFBundleName: Cassini
        CFBundleDisplayName: Cassini
        CassiniStoreListingPublic: "$(CASSINI_STORE_LISTING_PUBLIC)"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Code Myriad"
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: Cassini records your microphone as a separate local meeting track.
        NSAudioCaptureUsageDescription: Cassini records selected application or system audio locally when you start recording.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Ogg Opus Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.xiph.ogg-audio
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg Opus Audio
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - opus
                - oga
                - ogg
              public.mime-type:
                - audio/ogg
                - audio/opus
    entitlements:
      path: Cassini/Cassini.entitlements
      properties:
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - io.codemyriad.cassini-spks
          - io.codemyriad.cassini-spki
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
        com.apple.security.assets.music.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Cassini
        ENABLE_HARDENED_RUNTIME: "$(CASSINI_APP_HARDENED_RUNTIME)"
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: false
  CassiniWindowScreenshots:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes: [Fixtures]
    dependencies:
      - target: Cassini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.screenshots
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Cassini
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: true
        ENABLE_HARDENED_RUNTIME: false
  CassiniBrowserHost:
    type: tool
    platform: macOS
    sources:
      - path: Sources/cassini-browser-host
    dependencies:
      - package: CassiniKit
        product: CassiniBrowserControl
      - package: CassiniKit
        product: CassiniRecording
      - package: CassiniKit
        product: CassiniLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.browser-host
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: cassini-browser-host
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: BrowserSetup/NativeHost.entitlements
        ENABLE_HARDENED_RUNTIME: true
  CassiniControlHost:
    type: tool
    platform: macOS
    sources:
      - path: Sources/cassini-control-host
    dependencies:
      - package: CassiniKit
        product: CassiniBrowserControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.control-host
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: cassini-control-host
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: BrowserSetup/NativeHost.entitlements
        ENABLE_HARDENED_RUNTIME: true
  CassiniBrowserSetup:
    type: xpc-service
    platform: macOS
    sources:
      - path: BrowserSetup
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: CassiniKit
        product: CassiniBrowserSetup
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.browser-setup
        PRODUCT_NAME: CassiniBrowserSetup
        PRODUCT_MODULE_NAME: CassiniBrowserSetupService
        CODE_SIGN_ENTITLEMENTS: BrowserSetup/BrowserSetup.entitlements
    info:
      path: BrowserSetup/Info.plist
      properties:
        CFBundleDisplayName: Cassini browser setup
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        XPCService:
          ServiceType: Application
  CassiniWhistleWorker:
    type: tool
    platform: macOS
    sources:
      - path: Sources/cassini-whistle-worker
    dependencies:
      - package: CassiniKit
        product: CassiniWhistle
      - package: CassiniKit
        product: CassiniTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.whistle-worker
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: cassini-whistle-worker
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
  CassiniParakeetWorker:
    type: tool
    platform: macOS
    sources:
      - path: Sources/cassini-parakeet-worker
    dependencies:
      - package: CassiniKit
        product: CassiniParakeet
      - package: CassiniKit
        product: CassiniTranscription
      - package: CassiniKit
        product: CassiniWhistle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.parakeet-worker
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: cassini-parakeet-worker
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
  CassiniQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: CassiniKit
        product: CassiniKit
      - sdk: Quartz.framework
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleName: Cassini Transcript Preview
        CFBundleDisplayName: Cassini Transcript Preview
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Code Myriad"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.xiph.ogg-audio
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: QuickLook/CassiniQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.quicklook
        PRODUCT_NAME: CassiniQuickLook
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  CassiniModelDownloads:
    type: xpc-service
    platform: macOS
    sources:
      - path: ModelDownloads
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: CassiniKit
        product: CassiniModels
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.models
        PRODUCT_NAME: CassiniModelDownloads
        CODE_SIGN_ENTITLEMENTS: ModelDownloads/ModelDownloads.entitlements
    info:
      path: ModelDownloads/Info.plist
      properties:
        CFBundleDisplayName: Cassini model downloads
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        XPCService:
          ServiceType: Application

schemes:
  Cassini:
    build:
      targets:
        Cassini: all
    run:
      config: Debug
  CassiniScreenshots:
    build:
      targets:
        Cassini: all
        CassiniWindowScreenshots: [test]
    test:
      config: Debug
      targets:
        - CassiniWindowScreenshots
      gatherCoverageData: false

  CassiniModelDownloads:
    build:
      targets:
        CassiniModelDownloads: all
