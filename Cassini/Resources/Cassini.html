<!doctype html>

<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>{{app.name}}</title>
<style>
:root { color-scheme: light dark; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: {{token.ground.light}}; color: {{token.ink.light}}; }
main { margin: 32px; max-width: 480px; padding: 48px; border-radius: 20px; background: {{token.surface.light}}; box-shadow: 0 8px 40px {{token.shadow.light}}; }
.mark { width: 44px; height: 44px; border: 3px solid {{token.accent.light}}; border-radius: 50%; position: relative; }
.mark::after { content: ''; position: absolute; inset: 9px -8px; border: 2px solid {{token.accent.light}}; border-radius: 50%; transform: rotate(-30deg); }
h1 { font-size: 26px; margin: 30px 0 16px; letter-spacing: -.5px; }
p { line-height: 1.6; margin: 0; }
.address { margin-bottom: 12px; }
@media (prefers-color-scheme: dark) { body { background: {{token.ground.dark}}; color: {{token.ink.dark}}; } main { background: {{token.surface.dark}}; box-shadow: 0 8px 40px {{token.shadow.dark}}; } .mark, .mark::after { border-color: {{token.accent.dark}}; } }
</style></head><body><main>
<div class="mark" aria-hidden="true"></div>
<h1>{{app.name}}</h1>
<p class="address"><strong>{{companion.local.extensionsCopied}}</strong></p>
<p>{{companion.local.extensionsPasteHint}}</p>
</main></body></html>
