name: D36 recurrence source timing evidence
'on':
  push:
    branches: [ci/d36-recurrence-176]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: actions/download-artifact@v5
        with:
          name: ci-release
          run-id: 42566493594
          github-token: ${{ github.token }}
          path: release-product
      - id: sdk
        run: |
          python3 - <<'PY'
          import json,os,re
          commit=json.load(open('release-product/release.json'))['commit']
          assert re.fullmatch('[0-9a-f]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sdk.outputs.commit }}
          path: sdk-source
          persist-credentials: false
      - run: python3 sdk-source/scripts/ci-products.py unpack release "$GITHUB_WORKSPACE/release-product"
      - run: brew install displayplacer
      - run: python3 scripts/hosted-display.py
      - name: Verify unchanged renderer, clock and budgets; compile probe-only instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['Cassini/Recording/RecordingSpectrogram.swift','Spikes/Spectrogram/Budget.swift','Spikes/Spectrogram/Events.swift','Tests/CassiniRecordingTests/SpectrogramFixtureClock.swift']:
              assert Path(name).read_bytes()==(Path('sdk-source')/name).read_bytes(),name
          PY
          python3 scripts/build-spectrogram-probe.py sdk-source/build/Build/Products/Release build/d36-evidence.app
      - name: Paired source QoS evidence with original D case and gates
        run: python3 scripts/d36-recurrence.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d36-recurrence-176
          path: build/d36-evidence
          retention-days: 14
