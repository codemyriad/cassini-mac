name: D36 cold native host evidence
'on':
  push:
    branches: [ci/d36-native-host-169]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: actions/download-artifact@v5
        with:
          name: ci-release
          run-id: 42580139946
          github-token: ${{ github.token }}
          path: release-product
      - uses: actions/download-artifact@v5
        with:
          name: ci-debug
          run-id: 42580139946
          github-token: ${{ github.token }}
          path: debug-product
      - uses: actions/checkout@v5
        with:
          ref: f0d0d43a82a87a65e4bbd07b6fa5cb3f13a4c22c
          path: sdk-source
          persist-credentials: false
      - run: mdutil -a -s
      - run: python3 sdk-source/scripts/ci-products.py unpack debug "$GITHUB_WORKSPACE/debug-product"
      - run: python3 sdk-source/scripts/ci-products.py unpack release "$GITHUB_WORKSPACE/release-product"
      - run: brew install displayplacer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 sdk-source/scripts/hosted-display.py
      - name: Build original production probe against exact failed-job SDK
        run: |
          swiftc sdk-source/Spikes/Spectrogram/Budget.swift sdk-source/Spikes/Spectrogram/CheckBudget.swift -o build/check-budget
          build/check-budget
          xcrun swiftc -O -parse-as-library sdk-source/Spikes/Spectrogram/PixelOracle.swift sdk-source/Spikes/Spectrogram/CheckPixelOracle.swift -o build/check-pixels
          build/check-pixels
          xcrun swiftc -O -parse-as-library sdk-source/Tests/CassiniRecordingTests/SpectrogramFixtureClock.swift sdk-source/Spikes/Spectrogram/CheckSampleClock.swift -o build/check-clock
          build/check-clock
          python3 sdk-source/scripts/build-spectrogram-probe.py sdk-source/build/Build/Products/Release build/native-host.app
      - name: Observe original B plus every busy host process
        run: python3 scripts/d36-host-evidence.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d36-native-host-169
          path: build/host-evidence
          retention-days: 14
