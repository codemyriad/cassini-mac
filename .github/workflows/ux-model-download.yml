name: UX model downloader
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  downloader:
    name: Downloader (${{ matrix.runner }})
    needs: [build]
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-products
        with:
          swiftpm: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static decoder and notice pins offline
        run: python3 scripts/verify-model-vendor.py
      - name: Local HTTP fault fixtures only
        run: |
          set -o pipefail
          swift test --skip-build --filter ModelDownloaderTests 2>&1 | tee downloader.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: downloader-${{ matrix.runner }}
          path: downloader.log
