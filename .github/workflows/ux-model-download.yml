name: UX model downloader
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  downloader:
    name: Downloader (${{ matrix.runner }})
    needs: [build]
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    # D66 mac-P1-2: Intel only. The kit job already runs these same ModelDownloaderTests on
    # the same arm64 products, so an arm64 copy here was a duplicate macOS job.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-products
        with:
          swiftpm: 'true'
      # D66 mac-P1-3: no setup-python before swift test (with it, the fixture server's
      # interpreter made the suite take 15x longer); the vendor pin check runs on Ubuntu (ci.yml).
      - name: Local HTTP fault fixtures only
        run: |
          set -o pipefail
          swift test --skip-build --filter ModelDownloaderTests 2>&1 | tee downloader.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: downloader-${{ matrix.runner }}
          path: downloader.log
