name: Intel fixture native traceback evidence
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  models:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build the affected suite and retain native child tracebacks
        run: python3 scripts/intel-python-stack-evidence.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: intel-python-stack
          path: |
            build/intel-python-stack/tests.log
            build/intel-python-stack/host.top.txt
            build/intel-python-stack/children
          retention-days: 14
