name: Build shared CI products
on:
  workflow_call:
    inputs:
      parakeet_models:
        type: boolean
        default: true
        description: Include optional model golden fixtures in their separate artifact
permissions:
  contents: read
jobs:
  build:
    name: Build products (${{ matrix.arch }}, Xcode 16.4)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    # Trusted runs build both architectures on the rented Apple Silicon Macs: the x86_64 row is
    # cross-compiled there (same Xcode, same target triple). Hosted runners stay the fallback.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER || matrix.runner }}
    timeout-minutes: 30
    env:
      # The architecture of this row's products, whatever machine builds them.
      CASSINI_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - id: xcode
        run: bash scripts/ci-select-xcode.sh
      - run: swift --version
      # Freeze the source fingerprint before generated trees exist; cache post-save
      # otherwise evaluates hashFiles again and can time out walking build output.
      - id: swiftpm_key
        run: echo "hash=${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'BrowserSetup/**', 'Spikes/**', 'Whistle/pins.json', 'Opus/pins.json', 'Parakeet/pins.json', 'Parakeet/UPSTREAM.json', 'scripts/fetch-vad.py', 'scripts/fetch-opus.py') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          # Swift 6.1 can leave transitive clients with an obsolete nested-struct
          # layout after an incremental rebuild (see evidence/mac/flaky/swiftpm-layout).
          # Reuse compiled objects only for identical inputs. The new namespace
          # also excludes already-saved products built from cross-source restores.
          key: swiftpm-coherent-v1-${{ matrix.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ steps.xcode.outputs.workspace }}-${{ steps.swiftpm_key.outputs.hash }}
      - name: Compile all native Swift executables and test bundles once
        run: swift build --build-tests --arch ${{ matrix.arch }}
      - name: Verify SwiftPM products at identical and different checkout paths
        if: matrix.arch == 'arm64'
        run: python3 scripts/test-ci-product-paths.py --evidence build/product-paths
      - run: python3 scripts/ci-products.py pack swiftpm build/ci-upload/swiftpm
      - uses: actions/upload-artifact@v5
        with:
          name: ci-swiftpm-${{ matrix.arch }}
          path: build/ci-upload/swiftpm
          retention-days: 3
          compression-level: 0
      - uses: actions/cache@v4
        if: matrix.arch == 'arm64'
        with:
          path: |
            build/whistle-downloads
            build/vad-downloads
            build/opus-downloads
            build/parakeet-downloads
            .build/Sparkle
            build/dmg-pip-cache
            ~/Library/Caches/Homebrew
          key: pinned-fetches-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('Whistle/pins.json', 'Opus/pins.json', 'Parakeet/pins.json', 'Parakeet/UPSTREAM.json', 'Distribution/dmg-requirements.txt', 'scripts/fetch-*.py', 'project.yml') }}
          # Every fetch checks its pinned digest before reuse. Keep valid artifacts
          # when a fetch script changes instead of forcing all GitHub downloads.
          restore-keys: pinned-fetches-${{ steps.xcode.outputs.fingerprint }}-
      - name: Install build tools
        if: matrix.arch == 'arm64'
        run: brew install cmake xcodegen
      - name: Verify pins and build universal offline assets once
        if: matrix.arch == 'arm64'
        run: |
          python3 scripts/fetch-whistle.py --output build/Whistle
          python3 scripts/fetch-vad.py --output build/Whistle
          python3 scripts/fetch-opus.py --output build/Opus
          python3 scripts/fetch-parakeet-runtime.py --output build/Parakeet
          python3 scripts/ci-products.py pack assets build/ci-upload/assets
          python3 scripts/ci-products.py pack runtime build/ci-upload/runtime
      - uses: actions/upload-artifact@v5
        if: matrix.arch == 'arm64'
        with:
          name: ci-assets
          path: build/ci-upload/assets
          retention-days: 3
          compression-level: 0
      # The Release app job (ci-build-release.yml, D66 mac-P2-2) stages this runtime; the
      # optional ci-parakeet product below carries it only when the model goldens run.
      - uses: actions/upload-artifact@v5
        if: matrix.arch == 'arm64'
        with:
          name: ci-runtime
          path: build/ci-upload/runtime
          retention-days: 3
          compression-level: 0
      - uses: actions/cache@v4
        if: matrix.arch == 'arm64' && inputs.parakeet_models
        with:
          path: build/ParakeetModel
          key: parakeet-model-v2-4179-${{ hashFiles('Parakeet/model-manifest.json', 'Sources/CassiniModels/**', 'Sources/cassini-model-fetch/**') }}
      - name: Fetch and verify optional model once for ARM and Intel goldens
        if: matrix.arch == 'arm64' && inputs.parakeet_models
        run: |
          .build/debug/cassini-model-fetch --output build/ParakeetModel
          python3 scripts/ci-products.py pack parakeet build/ci-upload/parakeet
      - uses: actions/upload-artifact@v5
        if: matrix.arch == 'arm64' && inputs.parakeet_models
        with:
          name: ci-parakeet
          path: build/ci-upload/parakeet
          retention-days: 3
          compression-level: 0
      - name: Test signing identifier and shipped-byte checks on generated code
        if: matrix.arch == 'arm64'
        run: |
          python3 scripts/fetch-sparkle.py
          python3 scripts/fetch-sparkle.py --spm-cache "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          python3 scripts/test-sparkle-cache.py
          python3 scripts/test-release.py
          python3 scripts/test-publish-release.py
          python3 scripts/test-signing-keychain.py
          python3 scripts/test-dmg-layout.py
          python3 scripts/test-signing-identifiers.py
          python3 scripts/test-native-host-staging.py
      - name: Prepare identical bundled Library fixtures
        if: matrix.arch == 'arm64'
        run: |
          python3 Tests/CassiniLibraryTests/LibraryVectors/make.py UITests/Fixtures/Library
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for case in Path('UITests/Fixtures/Library').iterdir():
              if case.name not in ('main', 'empty', 'first-record', 'received-only'): shutil.rmtree(case)
          PY
          xcodegen generate
      - name: Build universal app and UI test bundles once
        if: matrix.arch == 'arm64'
        env:
          CASSINI_CI_ASSETS: ${{ github.workspace }}/build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Cassini.xcodeproj -scheme CassiniScreenshots -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CASSINI_APP_HARDENED_RUNTIME=NO 2>&1 | tee build/debug-build.log
          # Test actions add sandbox exceptions independently of base entitlements.
          # A normal incremental action reuses compiled objects and generates the
          # final product signatures/manifests without post-build re-signing.
          xcodebuild build -project Cassini.xcodeproj -scheme Cassini -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CASSINI_APP_HARDENED_RUNTIME=NO 2>&1 | tee build/debug-product-build.log
          codesign --verify --deep --strict build/Build/Products/Debug/Cassini.app
          python3 scripts/check-signing-identifiers.py build/Build/Products/Debug/Cassini.app
          python3 scripts/ci-products.py pack debug build/ci-upload/debug
      - uses: actions/upload-artifact@v5
        if: matrix.arch == 'arm64'
        with:
          name: ci-debug
          path: build/ci-upload/debug
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-diagnostics-${{ matrix.arch }}
          path: |
            build/*build.log
            build/product-paths
