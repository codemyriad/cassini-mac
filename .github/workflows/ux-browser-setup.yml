name: UX browser setup and control
on:
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
    with:
      parakeet_models: false
  setup:
    name: Browser setup (${{ matrix.runner }})
    needs: [build]
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-products
        with:
          swiftpm: 'true'
          debug: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native control transport lifecycle
        run: swift test --skip-build --filter 'CassiniBrowserControlTests|CassiniBrowserSetupTests'
      - name: Shared control-host vectors
        run: |
          python3 -m pip install -r browser-protocol/requirements-test.txt
          python3 browser-protocol/conformance/control/run.py .build/debug/cassini-control-host
      - name: Scoped XPC registration without touching browser profiles
        run: python3 scripts/test-browser-setup-spike.py --skip-build --output build/browser-setup-report.json
      - name: Production setup service with exact bundled host grants
        run: python3 scripts/test-browser-connect.py --skip-build --app build/Build/Products/Debug/Cassini.app --output build/browser-connect-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium for background registration check
        run: |
          npm ci --prefix BrowserExtension/tests
          BrowserExtension/tests/node_modules/.bin/playwright install chromium
      - name: Fresh browser follows the real Add from Cassini guide
        if: matrix.runner == 'macos-15'
        run: |
          brew install displayplacer
          python3 scripts/hosted-display.py
          python3 scripts/test-local-companion.py build/Build/Products/Debug/Cassini.app --output build/local-companion
      - name: Installed app connects to fresh browser without a click
        run: node scripts/test-browser-background.mjs build/Build/Products/Debug/Cassini.app build/browser-background-report.json
      - name: Real Chromium navigation and app-owned source restoration
        run: node scripts/test-browser-return.mjs build/Build/Products/Debug/Cassini.app build/browser-return-report.json
      - name: Product app capture ownership without devices
        run: python3 scripts/test-browser-capture-app.py build/Build/Products/Debug/Cassini.app --output build/browser-capture-app.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-setup-${{ matrix.runner }}
          path: |
            build/browser-setup-report.json
            build/browser-setup-report.stderr.txt
            build/browser-connect-report.json
            build/browser-connect-report.stderr.txt
            build/browser-background-report.json
            build/browser-background-report.json.stderr.txt
            build/browser-return-report.json
            build/browser-return-report.json.stderr.txt
            build/browser-return-report.json.stdout.txt
            build/browser-capture-app.json
            build/browser-capture-app.stderr.txt
            build/local-companion
