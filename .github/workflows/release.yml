name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Cassini.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Test CassiniKit
        run: swift test
      - name: Build Release
        run: |
          xcodebuild -project Cassini.xcodeproj -scheme Cassini -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build
      - name: Package
        id: package
        run: |
          ZIP="build/Cassini-${{ steps.version.outputs.version }}.zip"
          python3 scripts/package-release.py build/Build/Products/Release/Cassini.app "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sum=$ZIP.sha256" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          **Cassini for Mac** opens a Cassini portable meeting `.opus` file, plays it, and shows its
          transcript with word-by-word highlighting, click-to-seek and follow-along scrolling.

          Requires macOS 15 or later. The app is universal (Intel and Apple Silicon).

          ### Installing

          1. Download `Cassini-*.zip` below and unzip it.
          2. Move `Cassini.app` to your Applications folder.
          3. This build is ad-hoc signed and not notarized, so macOS blocks the first launch.
             Double-click `Cassini.app`; macOS shows a dialog titled **“Cassini” Not Opened** saying
             Apple could not verify it is free of malware. Click **Done**, not Move to Trash.
          4. Right away, open **System Settings → Privacy & Security**, scroll to the Security section,
             and click **Open Anyway** next to the Cassini notice. The notice only appears after a
             blocked launch and disappears after a while; if it is missing, open Cassini again and
             look again.
          5. Confirm the prompt and enter an administrator password or Touch ID (an admin account
             on the Mac is needed). On company-managed Macs the button may be hidden by policy;
             ask IT to allow the app.
          6. Open any `.opus` file with Cassini (File › Open, drag onto the icon, or Finder's Open With).

          Only approve a build you intentionally downloaded here. The right-click → Open shortcut of
          older macOS versions no longer works on macOS 15.

          ### Browser recording

          The archive also includes BrowserExtension, Install Browser Host.command, and setup
          instructions. Load the extension in chrome://extensions, then run the installer with
          its extension ID. The bundled host requires no Swift compiler, Xcode or Python.
          Keep the extension folder in a permanent location. Re-run setup after moving the app.

          ### Updating

          Quit Cassini, download the newer zip, and replace `Cassini.app` in Applications. Each
          build is a separately signed app, so expect the steps above again. There is no in-app
          updater yet. Bookmark the [latest release](https://github.com/${{ github.repository }}/releases/latest)
          or enable GitHub notifications with **Watch → Custom → Releases**.
          EOF
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "This private repository requires GitHub access to download releases." >> notes.md
          fi
          cat >> notes.md <<'EOF'

          The SHA-256 of the archive is in the `.sha256` file.
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Cassini for Mac ${{ steps.version.outputs.version }}" \
            --notes-file notes.md --generate-notes \
            "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.sum }}"
