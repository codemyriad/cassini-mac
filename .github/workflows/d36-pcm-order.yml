name: D36 PCM checkpoint ordering regression
'on':
  push:
    branches: [ci/d36-pcm-observer-order]
permissions:
  contents: read
jobs:
  ordering:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Confirm event-driven regression fails the old checkpoint ordering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          memory_pressure
          vm_stat
          set +e
          lockf -k -t 3600 "$HOME/.cassini-heavy.lock" swift test -j 1 --filter PCMCheckpointTests > evidence/before.log 2>&1
          before_status=$?
          set -e
          cat evidence/before.log
          test "$before_status" -ne 0
          grep -q 'The recorded PCM observer must be independent of a periodic durability stall' evidence/before.log
          grep -q 'Executed 1 test, with 1 failure' evidence/before.log
      - name: Apply the reviewable candidate and run observer and durability regressions
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/d36-pcm-order.patch
          git diff --check
          memory_pressure
          vm_stat
          lockf -k -t 3600 "$HOME/.cassini-heavy.lock" swift test -j 1 --filter 'PCMCheckpointTests|CapturePCMTests|RecordedPCM|SourceTransactionTests' 2>&1 | tee evidence/after.log
      - name: Full candidate package suite
        shell: bash
        run: |
          set -euo pipefail
          memory_pressure
          vm_stat
          lockf -k -t 3600 "$HOME/.cassini-heavy.lock" swift test --skip-build -j 1 2>&1 | tee evidence/full.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d36-pcm-order
          path: evidence
          retention-days: 14
