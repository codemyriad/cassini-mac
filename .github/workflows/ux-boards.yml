name: UX Library boards
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  release:
    needs: [build]
    if: ${{ !inputs.products_ready && needs.build.result == 'success' }}
    uses: ./.github/workflows/ci-build-release.yml
  boards:
    needs: [build, release]
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success' && needs.release.result == 'success') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CM_MAC_GUI_RUNNER || 'macos-15' }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
    - run: python3 scripts/gui_session.py
    - run: command -v displayplacer >/dev/null || brew install displayplacer
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    - run: python3 scripts/check-ux-copy.py
    - name: Prepare hosted display (fixtures are in the shared app)
      run: |
        python3 scripts/hosted-display.py
    - name: Render Library boards
      # D66 mac-P0-5: inside the job's 25 minutes, so a hang fails this step and the failure
      # diagnostics and xcresult upload below still run.
      timeout-minutes: 19
      env:
        TEST_RUNNER_CASSINI_HOSTED_SCREENSHOTS: '1'
        TEST_RUNNER_CASSINI_LIBRARY_BOARDS: '1'
      run: |
        set -o pipefail
        xcodebuild test-without-building -xctestrun "$(find build/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)" \
          -destination 'platform=macOS' -parallel-testing-enabled NO -only-testing:CassiniWindowScreenshots/LibraryBoards \
          -resultBundlePath build/UXBoards.xcresult \
          2>&1 | tee build/ux-boards.log
    - name: Library boards test durations
      if: always()
      run: |
        python3 - <<'PY'
        import json, os, subprocess
        try:
            raw = subprocess.run(['xcrun','xcresulttool','get','test-results','tests','--path','build/UXBoards.xcresult'],capture_output=True,text=True,timeout=120,check=True).stdout
        except Exception as error:
            print('no test durations:',error); raise SystemExit(0)
        # A summary only: whatever the xcresult holds, this step never fails the job.
        try:
          tests = []
          def walk(node):
              if node.get('nodeType') == 'Test Case':
                  tests.append((node.get('durationInSeconds') or 0, node.get('name','?'), node.get('result','?')))
              for child in node.get('children',[]): walk(child)
          for node in json.loads(raw).get('testNodes',[]): walk(node)
          total = sum(t[0] for t in tests)
          lines = [f'Library boards: {len(tests)} tests, {total/60:.1f} min of test time', '', '| s | test | result |', '|---:|---|---|']
          lines += [f'| {d:.1f} | {n} | {r} |' for d,n,r in sorted(tests,reverse=True)[:15]]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write(chr(10).join(lines)+chr(10))
          if total > 16*60: print(f'::warning::Library boards tests took {total/60:.1f} min of the 19 min step bound')
        except Exception as error:
            print('no test durations:',error)
        PY
    - name: Export exact board PNGs
      if: always()
      run: |
        xcrun xcresulttool export attachments --path build/UXBoards.xcresult --output-path build/ux-attachments
        python3 scripts/export-ux-boards.py build/ux-attachments build/ux-boards
    - name: Real app search without playback
      if: always()
      run: python3 scripts/test-search-app.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/search-app.json
    - name: Real app meeting-page turn preparation (off the main actor, outage and recovery)
      if: always()
      run: python3 scripts/test-meeting-preparation-app.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/meeting-preparation-app.json
    - name: Listening announcements and shortcuts after sheets and editing
      if: always()
      run: python3 scripts/test-listening-app.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/listening-app.json
    - name: Real recording controls without devices
      if: always()
      run: python3 scripts/test-recording-comfort.py build/Build/Products/Debug/Cassini.app --output build/ux-boards
    - name: Private stopped recording clock without devices or windows
      run: python3 scripts/test-recording-saving.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/saving-clock.json
    - name: Private import and queue lifecycle without devices
      if: always()
      run: python3 scripts/test-import-lifecycle.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/import-lifecycle.json
    - name: Actual sandbox Trash, Undo and Finder Put Back without devices
      if: always()
      run: python3 scripts/test-trash-app.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/trash-app.json
    - name: Private Settings and Library relocation without devices
      if: always()
      run: |
        codesign --force --sign - --options 0 --timestamp=none --entitlements Cassini/Cassini.entitlements build/Build/Products/Debug/Cassini.app
        python3 scripts/test-settings-app.py build/Build/Products/Debug/Cassini.app --output build/ux-boards/settings-app.json
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: ux-boards
        path: build/ux-boards
    - name: Preserve hosted app diagnostics
      if: failure()
      run: /usr/bin/log show --style compact --last 10m --predicate 'process == "Cassini"' > build/cassini-app.log
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: failure()
      with:
        retention-days: 14
        name: ux-boards-diagnostics
        path: |
          build/UXBoards.xcresult
          build/ux-boards.log
          build/cassini-app.log
          build/display-*
    name: Library boards
  # D66: 52 UI tests took 14.9 min, then native A–E/profiling took another
  # ~9 min. Together they exhausted the 25 min job during cleanup despite every
  # assertion passing (42395485443). Measure on a separate hosted display, with
  # the same products, inputs and budgets; leave each job time to upload evidence.
  spectrogram:
    name: Native spectrogram and profiling
    needs: [build, release]
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success' && needs.release.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    # D66: the cold-host diagnostic42584372604 records mds_stores at182% CPU
    # after restoring the SDKs. Apply the same disposable-runner precondition
    # as browser audio CI before extraction queues more indexing work.
    - name: Disable Spotlight indexing on the disposable native runner
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo mdutil -a -i off
        mdutil -a -s
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
        release: 'true'
    - run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - run: command -v displayplacer >/dev/null || brew install displayplacer
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare hosted display
      run: python3 scripts/hosted-display.py
    - name: Pure hosted budget policy boundaries (D36.2)
      run: |
        swiftc Spikes/Spectrogram/Budget.swift Spikes/Spectrogram/CheckBudget.swift -o "$RUNNER_TEMP/spectrogram-budget"
        "$RUNNER_TEMP/spectrogram-budget"
    - name: Production spectrogram A–E, native views and Time Profiler without devices
      timeout-minutes: 12
      run: |
        python3 scripts/test-spectrogram-harness.py
        xcrun swiftc -O -parse-as-library Spikes/Spectrogram/PixelOracle.swift Spikes/Spectrogram/CheckPixelOracle.swift -o build/check-spectrogram-pixels
        build/check-spectrogram-pixels
        xcrun swiftc -O -parse-as-library Tests/CassiniRecordingTests/SpectrogramFixtureClock.swift Spikes/Spectrogram/CheckSampleClock.swift -o build/check-spectrogram-clock
        build/check-spectrogram-clock
        python3 scripts/build-spectrogram-probe.py build/Build/Products/Release build/Build/Products/Release/cassini-spectrogram-probe.app --scheduling-output build/check-spectrogram-scheduling
        python3 scripts/test-spectrogram-app.py build/Build/Products/Release/cassini-spectrogram-probe.app --scheduling-checker build/check-spectrogram-scheduling --output build/ux-boards/spectrogram
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: ux-spectrogram
        path: build/ux-boards/spectrogram
