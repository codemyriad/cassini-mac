name: UX window screenshot spike
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  screenshots:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
    - name: Require GitHub-hosted runner
      run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - name: Capture actual windows with XCUITest
      env:
        TEST_RUNNER_CASSINI_HOSTED_SCREENSHOTS: '1'
      run: |
        set -o pipefail
        mkdir -p build
        xcodebuild test-without-building -xctestrun "$(find build/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)" -destination 'platform=macOS' -parallel-testing-enabled NO \
          -resultBundlePath build/WindowScreenshots.xcresult \
          2>&1 | tee build/window-tests.log
    - name: Export window PNGs
      if: always()
      run: |
        xcrun xcresulttool export attachments --path build/WindowScreenshots.xcresult \
          --output-path build/window-screenshots
    - name: Require both whole-window PNGs
      run: python3 scripts/check-window-screenshots.py build/window-screenshots
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: window-screenshots-${{ github.sha }}
        path: |
          build/window-screenshots/*.png
          build/window-screenshots/manifest.json
          build/window-tests.log
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: window-screenshot-diagnostics-${{ github.sha }}
        path: build/WindowScreenshots.xcresult
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    name: Window screenshots
