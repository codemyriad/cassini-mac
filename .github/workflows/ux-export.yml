name: UX portable exports
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  exports:
    strategy:
      fail-fast: false
      matrix:
        runner:
        - macos-15
        - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
        assets: 'true'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Golden text, policy, packet preservation, safe save and audio round trips
      env:
        CASSINI_OPUS_ASSETS: ${{ github.workspace }}/build/Opus
        CASSINI_EXPORT_REPORT_DIR: ${{ github.workspace }}/build/export-cases
      run: swift test --skip-build --filter 'ExportGoldenTests|MeetingExportTests|ExportDestinationTests|PortableWriterTests|OpusTests|LibraryImport'
    - uses: actions/checkout@v5
      with:
        repository: codemyriad/cassini-format
        ref: 867f68c56292ada9464b8516dc2797003d5af9eb
        path: build/format-reference
        persist-credentials: 'false'
    - name: Independent pure metadata and audio readers
      run: python3 scripts/check-export-reference.py build/format-reference build/export-cases
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: exports-${{ matrix.runner }}
        path: |
          build/export-cases
          build/Opus/pins.json
          build/Opus/unsigned-sha256.json
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    name: Portable exports (${{ matrix.runner }})
