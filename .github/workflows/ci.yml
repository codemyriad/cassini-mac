name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: D95 SIGBUS diagnostic only
    runs-on: ${{ vars.CM_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/ci-select-xcode.sh
      - run: python3 scripts/fetch-opus.py --output build/Opus
      - name: Build and run headless XCTest with native fatal trace
        run: |
          if [ -x "$HOME/bin/heavy-run" ]; then
            "$HOME/bin/heavy-run" bash scripts/run-sigbus-diagnostic.sh
          else
            bash scripts/run-sigbus-diagnostic.sh
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d95-sigbus-diagnostic
          retention-days: 7
          path: |
            build/diag
            .build/arm64-apple-macosx/debug/CassiniKitPackageTests.xctest
            .build/arm64-apple-macosx/debug/CassiniKitPackageTests.xctest.dSYM
