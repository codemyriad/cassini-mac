  whistle:
    name: Whistle bundle
    needs:
    - changes
    - build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full_ci == 'true' && needs.changes.outputs.whistle != 'false' }}
    uses: ./.github/workflows/ux-whistle.yml
    with:
      products_ready: true
  # D66 mac-P2-1: the Intel exports and Intel downloader jobs, as one job. Deferred to nightly,
  # workflow_dispatch, and full-ci labeled PRs so PR/main pushes run <= 4-5 macOS jobs.
  package_tests:
    name: Package tests (macos-15-intel)
    needs: [changes, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full_ci == 'true' && (needs.changes.outputs.exports != 'false' || needs.changes.outputs.model_download != 'false') }}
    # Trusted runs use the rented Apple Silicon Macs and execute the x86_64 products through
    # Rosetta 2; fork pull requests and an unset CM_MAC_RUNNER keep the hosted Intel runner,
    # where `arch -x86_64` changes nothing.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 25
    defaults:
      run:
        shell: arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      CASSINI_CI_ARCH: x86_64
      EXPORTS: ${{ needs.changes.outputs.exports != 'false' }}
      MODEL_DOWNLOAD: ${{ needs.changes.outputs.model_download != 'false' }}
    steps:
    - uses: actions/checkout@v5
    - id: products
      uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
        assets: 'true'
    # D66 mac-P1-3: the downloader runs before setup-python (with it, the fixture server's
    # interpreter made the suite take 15x longer).
    - name: Model downloader, local HTTP fault fixtures only
      if: env.MODEL_DOWNLOAD == 'true'
      timeout-minutes: 8
      env:
        CASSINI_FIXTURE_DIAGNOSTICS: ${{ github.workspace }}/build/model-bootstrap
        # Bound cold interpreter startup only; ready servers/tests remain concurrent.
        CASSINI_FIXTURE_BOOTSTRAP_LIMIT: '2'
      run: |
        set -o pipefail
        swift test --skip-build --filter ModelDownloaderTests 2>&1 | tee downloader.log
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.MODEL_DOWNLOAD == 'true'
      with:
        retention-days: 14
        name: downloader-macos-15-intel
        path: |
          downloader.log
          build/model-bootstrap
    # The installer needs the hosted tool directory; a rented Mac runs the pure-Python reference
    # reader with its own python3.
    - uses: actions/setup-python@v5
      if: ${{ !cancelled() && steps.products.outcome == 'success' && env.EXPORTS == 'true' && runner.environment == 'github-hosted' }}
      with:
        python-version: '3.12'
    - name: Portable exports, golden text, policy, packet preservation, safe save and audio round trips
      id: exports
      if: ${{ !cancelled() && steps.products.outcome == 'success' && env.EXPORTS == 'true' }}
      timeout-minutes: 12
      env:
        CASSINI_OPUS_ASSETS: ${{ github.workspace }}/build/Opus
        CASSINI_EXPORT_REPORT_DIR: ${{ github.workspace }}/build/export-cases
      run: swift test --skip-build --filter 'ExportGoldenTests|MeetingExportTests|ExportDestinationTests|PortableWriterTests|OpusTests|LibraryImport|R65CodemyriadNamespaceTests'
    - uses: actions/checkout@v5
      if: ${{ !cancelled() && steps.products.outcome == 'success' && env.EXPORTS == 'true' }}
      with:
        repository: codemyriad/cassini-format
        ref: 867f68c56292ada9464b8516dc2797003d5af9eb
        path: build/format-reference
        persist-credentials: 'false'
    - name: Independent pure metadata and audio readers
      if: ${{ !cancelled() && steps.products.outcome == 'success' && env.EXPORTS == 'true' && steps.exports.outcome == 'success' }}
      run: python3 scripts/check-export-reference.py build/format-reference build/export-cases
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.EXPORTS == 'true'
      with:
        retention-days: 14
        name: exports-macos-15-intel
        path: |
          build/export-cases
          build/Opus/pins.json
          build/Opus/unsigned-sha256.json

