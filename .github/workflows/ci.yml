name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  push:
    branches:
    - main
    - ux/1a-library-model
  schedule:
  - cron: 43 2 * * *
  workflow_dispatch: null
# D66 mac-P1-1: a newer push to a pull request cancels that PR's older run. Every push, nightly
# and manual run has a group of its own (its run id), so none is ever cancelled or replaced while
# pending, and every main commit keeps its own push run (D20).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shot: ${{ steps.paths.outputs.shot }}
      boards: ${{ steps.paths.outputs.boards }}
      exports: ${{ steps.paths.outputs.exports }}
      whistle: ${{ steps.paths.outputs.whistle }}
      model_download: ${{ steps.paths.outputs.model_download }}
      parakeet: ${{ steps.paths.outputs.parakeet }}
      browser_setup: ${{ steps.paths.outputs.browser_setup }}
      full_ci: ${{ steps.paths.outputs.full_ci }}
      ui_shots: ${{ steps.paths.outputs.ui_shots }}
      release_build: ${{ steps.paths.outputs.release_build }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: paths
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        EVENT_NAME: ${{ github.event_name }}
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        python3 scripts/test-ci-contract.py
        python3 scripts/test-gui-session.py
        python3 scripts/test-render-local-ux.py
        python3 scripts/ci-test-xcode.py
        python3 scripts/verify-model-vendor.py
        python3 scripts/ci-changes.py
  build:
    needs: [changes]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' }}
    uses: ./.github/workflows/ci-build.yml
    with:
      parakeet_models: ${{ needs.changes.outputs.parakeet != 'false' }}
      include_intel: ${{ needs.changes.outputs.full_ci == 'true' }}
  # D66 mac-P2-2: the Release app and its packaging (Cassini-<sha>), off the Debug consumers'
  # critical path; runs on main pushes, nightly, workflow_dispatch, and full-ci labeled PRs.
  build_release:
    needs: [changes, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.release_build == 'true' }}
    uses: ./.github/workflows/ci-build-release.yml
  kit:
    name: CassiniKit tests and conformance
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER || 'macos-15' }}
    # About 2.5x its historical p95 (9.2 min); a
    # hang can't hold a shared macOS slot for 6 hours (D66 mac-P0-5, #130 review).
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
        assets: 'true'
    - name: Swift version
      run: swift --version
    # D66 mac-P2-1: with the pinned Opus assets and an export report folder, this one run also
    # covers the arm64 portable-export suites (golden text, packet preservation, safe save and
    # audio round trips) that the separate arm64 exports job ran.
    - name: Test
      env:
        CASSINI_OPUS_ASSETS: ${{ github.workspace }}/build/Opus
        CASSINI_EXPORT_REPORT_DIR: ${{ github.workspace }}/build/export-cases
      run: |
        python3 scripts/test-swift-test-runner.py
        # Keep transfer and supersession-lock deadlines independent of native writer/decoder load.
        # The model, remaining and hosted bookmark partitions retain every test.
        # Security-scoped bookmark creation requires the login session in native_sink.
        python3 scripts/run-swift-tests.py --output build/unit-tests/models -- swift test --skip-build --filter 'ModelDownloaderTests|ModelSupersessionTests'
        python3 scripts/run-swift-tests.py --output build/unit-tests/remaining -- swift test --skip-build --skip 'ModelDownloaderTests|ModelSupersessionTests|recordingAccessFollowsRenamedBookmarkAndFailsDuringMovePublication'
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        name: unit-tests-and-stacks
        path: build/unit-tests
        retention-days: 14
    # Shared test 9 (D55, protocol conformance/placement): every consumer of a track's placement
    # (recognizer input, word times, export mix, playback, offsetsAssumedZero) on the golden's clean
    # folders and its three app mutants, checked by the shared oracle (placement.py check).
    - name: Shared test 9, placement golden
      env:
        CASSINI_OPUS_ASSETS: ${{ github.workspace }}/build/Opus
        CASSINI_PIPELINE_ASSETS: ${{ github.workspace }}/build/Whistle
        CASSINI_PLACEMENT_REPORT_DIR: ${{ github.workspace }}/build/placement
        NEEDLE_TELEMETRY: '0'
        DO_NOT_TRACK: '1'
        ORT_DISABLE_TELEMETRY: '1'
      run: swift test --skip-build --filter SharedPlacementTests
    - name: Browser audio worklet tests
      run: node --test browser-protocol/extension/tests/*.test.cjs BrowserExtension/tests/tone-window.test.cjs
    - name: Verify shared browser snapshot
      run: python3 browser-protocol/verify.py --pinned BrowserExtension
    - name: Shared native-session fixture
      run: python3 browser-protocol/conformance/check-native-fixture.py
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    - uses: actions/checkout@v5
      with:
        repository: codemyriad/cassini-format
        ref: 867f68c56292ada9464b8516dc2797003d5af9eb
        path: build/format-reference
        persist-credentials: 'false'
    - name: Independent pure metadata and audio readers
      run: python3 scripts/check-export-reference.py build/format-reference build/export-cases
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: exports-macos-15
        path: |
          build/export-cases
          build/placement
          build/Opus/pins.json
          build/Opus/unsigned-sha256.json
    - name: Install strict conformance dependencies in a job-private environment
      run: |
        python3 -m venv "$RUNNER_TEMP/conformance-python"
        "$RUNNER_TEMP/conformance-python/bin/python3" -m pip install -r browser-protocol/requirements-test.txt
        echo "$RUNNER_TEMP/conformance-python/bin" >> "$GITHUB_PATH"
    - name: Browser host conformance
      run: python3 browser-protocol/conformance/run.py .build/debug/cassini-browser-host
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pinned browser tests
      run: |
        npm ci --prefix BrowserExtension/tests
        BrowserExtension/tests/node_modules/.bin/playwright install chromium
    - name: Extension native-messaging diagnostics survive their worker (D66 mac-P0-1)
      timeout-minutes: 3
      run: |
        node --test scripts/test-native-log-events.mjs
        node scripts/test-extension-native-log.mjs
    - name: Browser capture scenarios
      timeout-minutes: 8
      run: |
        set -o pipefail
        mkdir -p BrowserExtension/tests/artifacts
        PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/BrowserExtension/tests/node_modules/playwright/index.mjs" node browser-protocol/tests/product-topologies.mjs 2>&1 | tee BrowserExtension/tests/artifacts/topologies.log
        node BrowserExtension/tests/synthetic-capture.mjs 2>&1 | tee BrowserExtension/tests/artifacts/synthetic.log
        node BrowserExtension/tests/extension-capture.mjs 2>&1 | tee BrowserExtension/tests/artifacts/extension.log
        echo "Real tabCapture is a manual check (node BrowserExtension/tests/tab-capture.mjs): hosted macOS has no reliable output audio device." >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: failure()
      with:
        retention-days: 14
        name: recording-failure-${{ github.sha }}
        path: |
          BrowserExtension/tests/artifacts
          browser-protocol/artifacts
    - name: Conformance suite (full profile)
      working-directory: Tests/CassiniKitTests/Conformance
      run: |
        python3 run-conformance.py --adapter "$GITHUB_WORKSPACE/.build/debug/cassini-inspect" --profile full | tee full.txt
        grep -q " 0 fail" full.txt
        python3 run-conformance.py --adapter "$GITHUB_WORKSPACE/.build/debug/cassini-inspect --metadata" --profile metadata | tee metadata.txt
        grep -q " 0 fail" metadata.txt
    # Library and Search remain part of the complete headless suite.
    - name: Golden vectors and read-only Library tests (UTC, C locale)
      timeout-minutes: 5
      env:
        TZ: UTC
        LANG: C
        CASSINI_LIBRARY_RESULTS: ux-library-vector-results
      run: |
        set -o pipefail
        swift test --skip-build --filter 'Library|SearchTests' --skip recordingAccessFollowsRenamedBookmarkAndFailsDuringMovePublication 2>&1 | tee ux-library-tests.log
    - uses: actions/upload-artifact@v5
      if: always()
      continue-on-error: true
      with:
        retention-days: 14
        name: ux-library-test-results
        path: |
          ux-library-tests.log
          ux-library-vector-results
    needs:
    - build
  # Normal PRs and main pushes consolidate the three headless arm64 worker/control suites plus
  # headless board/spectrogram oracle checks into one self-hosted M4-first job, and the four
  # disposable-hosted login-session smoke checks into one hosted macos-15 job (<= 4 macOS jobs
  # per PR push; 5 on main push with build_release). Nightly, workflow_dispatch, and full-ci
  # labeled PRs run the full standalone/Intel/GUI workflows below instead.
  ux_workers:
    name: UX workers and conformance
    needs: [changes, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full_ci != 'true' && (needs.changes.outputs.whistle != 'false' || needs.changes.outputs.parakeet != 'false' || needs.changes.outputs.browser_setup != 'false' || needs.changes.outputs.boards != 'false') }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: arch -arm64 /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      CASSINI_CI_ARCH: arm64
      BOARDS: ${{ needs.changes.outputs.boards != 'false' }}
      WHISTLE: ${{ needs.changes.outputs.whistle != 'false' }}
      PARAKEET: ${{ needs.changes.outputs.parakeet != 'false' }}
      BROWSER_SETUP: ${{ needs.changes.outputs.browser_setup != 'false' }}
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      CASSINI_PARAKEET_RUNTIME: ${{ github.workspace }}/build/Parakeet
      CASSINI_PARAKEET_MODEL: ${{ github.workspace }}/build/ParakeetModel/models/parakeet-ultra-0.6b-int8-v2/50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366
      CASSINI_PIPELINE_ASSETS: ${{ github.workspace }}/build/Whistle
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
        assets: ${{ (needs.changes.outputs.whistle != 'false' || needs.changes.outputs.parakeet != 'false') && 'true' || 'false' }}
        parakeet: ${{ needs.changes.outputs.parakeet != 'false' && 'true' || 'false' }}
    - run: test "$GITHUB_ACTIONS" = true && { test "$RUNNER_ENVIRONMENT" = github-hosted || test "$RUNNER_ENVIRONMENT" = self-hosted; }
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    - run: test "$(python3 -c 'import platform; print(platform.machine())')" = "$CASSINI_CI_ARCH"
    - name: Copy policy and headless spectrogram oracle checks
      if: env.BOARDS == 'true'
      run: |
        mkdir -p build
        python3 scripts/check-ux-copy.py
        swiftc Spikes/Spectrogram/Budget.swift Spikes/Spectrogram/CheckBudget.swift -o "$RUNNER_TEMP/spectrogram-budget"
        "$RUNNER_TEMP/spectrogram-budget"
        python3 scripts/test-spectrogram-harness.py
        swiftc Spikes/Spectrogram/Host.swift Spikes/Spectrogram/CheckHost.swift -o build/check-spectrogram-host
        build/check-spectrogram-host
        xcrun swiftc -O -parse-as-library Spikes/Spectrogram/PixelOracle.swift Spikes/Spectrogram/CheckPixelOracle.swift -o build/check-spectrogram-pixels
        build/check-spectrogram-pixels
        xcrun swiftc -O -parse-as-library Tests/CassiniRecordingTests/SpectrogramFixtureClock.swift Spikes/Spectrogram/CheckSampleClock.swift -o build/check-spectrogram-clock
        build/check-spectrogram-clock
    - name: Build worker and Whistle regressions
      if: env.WHISTLE == 'true'
      run: |
        swift test --skip-build --filter Whistle
        python3 scripts/test-worker-events.py
        python3 scripts/test-whistle-worker-events.py
        python3 scripts/test-whistle-fetch.py
    - name: Verified model memory and process ownership
      if: env.WHISTLE == 'true'
      env:
        CASSINI_WHISTLE_TEST_ASSETS: ${{ github.workspace }}/build/Whistle
      run: swift test --skip-build --filter WhistleAssetIntegrationTests
    - name: Shared FIR, segmentation and strict Whistle goldens
      if: env.WHISTLE == 'true'
      env:
        CASSINI_PIPELINE_REPORT_DIR: ${{ github.workspace }}/build/pipeline
      run: swift test --skip-build --filter 'PipelineTests|TranscriptionMeetingTests'
    - name: Constructor privacy guard and persistent worker JFK golden
      if: env.WHISTLE == 'true'
      run: python3 scripts/test-whistle-worker.py --worker .build/debug/cassini-whistle-worker --bundle build/Whistle --report build/whistle-macos-15.json
    - name: Preserve worker crash diagnostics
      if: failure() && env.WHISTLE == 'true'
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import shutil
        output = Path('build/whistle-crashes'); output.mkdir(parents=True, exist_ok=True)
        for report in (Path.home()/'Library/Logs/DiagnosticReports').glob('cassini-whistle-worker*'):
            if report.is_file(): shutil.copy2(report, output/report.name)
        PY
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.WHISTLE == 'true'
      with:
        retention-days: 14
        name: whistle-macos-15
        path: |
          build/pipeline
          build/whistle-*
          build/Whistle/unsigned-sha256.json
    - name: Both strict D16 input goldens, token conversion and accepted model leases
      if: env.PARAKEET == 'true'
      run: |
        set -o pipefail
        mkdir -p build/parakeet-reports
        swift test --skip-build --filter 'Parakeet|ProgressTests' 2>&1 | tee build/parakeet-reports/goldens.log
    - name: Native Parakeet runtime privacy, integrity and parent lifetime
      if: env.PARAKEET == 'true'
      run: |
        python3 scripts/test-parakeet-worker.py --worker .build/debug/cassini-parakeet-worker \
          --runtime "$CASSINI_PARAKEET_RUNTIME" --model "$CASSINI_PARAKEET_MODEL" --vad "$CASSINI_PIPELINE_ASSETS" \
          --report build/parakeet-reports/worker.json
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.PARAKEET == 'true'
      with:
        retention-days: 14
        name: parakeet-runtime-macos-15
        path: build/parakeet-reports
    - name: Browser control lifecycle, spectrogram goldens and shared control-host vectors
      if: env.BROWSER_SETUP == 'true'
      run: |
        python3 -m venv "$RUNNER_TEMP/control-python"
        "$RUNNER_TEMP/control-python/bin/python3" -m pip install -r browser-protocol/requirements-test.txt
        swift test --skip-build --filter 'CassiniBrowserControlTests|CassiniBrowserSetupTests|CassiniSpectrogramTests'
        "$RUNNER_TEMP/control-python/bin/python3" browser-protocol/conformance/check-call-lifecycle.py
        "$RUNNER_TEMP/control-python/bin/python3" browser-protocol/conformance/control/run.py .build/debug/cassini-control-host
  ux_app:
    name: Mac app login-session smoke
    # NSApplication, ScopedBookmarksAgent, App Sandbox inheritance and XPC browser setup require a
    # disposable hosted macOS login session (scripts/gui-runner/README.md). Combining all four
    # arm64 checks here caps hosted macOS demand at <= 1 slot per PR/main push.
    needs: [changes, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full_ci != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      WHISTLE: ${{ needs.changes.outputs.whistle != 'false' }}
      PARAKEET: ${{ needs.changes.outputs.parakeet != 'false' }}
      BROWSER_SETUP: ${{ needs.changes.outputs.browser_setup != 'false' }}
      NEEDLE_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      ORT_DISABLE_TELEMETRY: '1'
      CASSINI_PARAKEET_RUNTIME: ${{ github.workspace }}/build/Parakeet
      CASSINI_PARAKEET_MODEL: ${{ github.workspace }}/build/ParakeetModel/models/parakeet-ultra-0.6b-int8-v2/50c15b94ea9cb1c2f8dbcdcbc0f15b450169154deeb206923cb5388f60892366
      CASSINI_PIPELINE_ASSETS: ${{ github.workspace }}/build/Whistle
    steps:
    - name: Disable Spotlight indexing on the disposable runner
      run: |
        sudo mdutil -a -i off
        mdutil -a -s
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
        swiftpm: 'true'
        assets: ${{ (needs.changes.outputs.whistle != 'false' || needs.changes.outputs.parakeet != 'false') && 'true' || 'false' }}
        parakeet: ${{ needs.changes.outputs.parakeet != 'false' && 'true' || 'false' }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - name: Snapshot clean Debug app bundle for isolated smoke phases
      run: ditto build/Build/Products/Debug/Cassini.app "$RUNNER_TEMP/clean-Debug-Cassini.app"
    - name: Real scoped bookmark follows a renamed Library root
      run: |
        python3 scripts/run-swift-tests.py --output build/unit-tests/scoped-bookmark -- swift test --skip-build --filter recordingAccessFollowsRenamedBookmarkAndFailsDuringMovePublication
    - uses: actions/upload-artifact@v5
      if: always()
      continue-on-error: true
      with:
        name: scoped-bookmark-${{ github.sha }}
        path: build/unit-tests/scoped-bookmark
        retention-days: 14
    - name: Native recording sink (generated 440/880 Hz stereo through the production sink and WAV writer)
      timeout-minutes: 5
      run: |
        python3 scripts/run-native-ci.py --mode sink-only --app build/Build/Products/Debug/Cassini.app \
          --artifacts "$RUNNER_TEMP/native-artifacts"
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: native-recording-${{ github.sha }}
        path: ${{ runner.temp }}/native-artifacts
    - name: Verify universal app with signed Whistle engine, Opus export and sandbox-inheriting worker
      if: env.WHISTLE == 'true'
      env:
        CASSINI_HOSTED_WHISTLE: '1'
      run: |
        rm -rf build/Build/Products/Debug/Cassini.app
        ditto "$RUNNER_TEMP/clean-Debug-Cassini.app" build/Build/Products/Debug/Cassini.app
        codesign --force --sign - --entitlements Cassini/Cassini.entitlements build/Build/Products/Debug/Cassini.app
        codesign --verify --deep --strict build/Build/Products/Debug/Cassini.app
        python3 scripts/test-export-sandbox.py build/Build/Products/Debug/Cassini.app --output build/export-sandbox.json
        python3 scripts/check-whistle-bundle.py build/Build/Products/Debug/Cassini.app
        python3 - <<'PY'
        import os, subprocess
        from pathlib import Path
        result = subprocess.run(['build/Build/Products/Debug/Cassini.app/Contents/MacOS/Cassini', '--whistle-self-test'], env=os.environ, capture_output=True, text=True, timeout=60)
        Path('build/whistle-sandbox.json').write_text(result.stdout)
        Path('build/whistle-sandbox-stderr.txt').write_text(result.stderr)
        print(result.stdout); print(result.stderr)
        assert result.returncode == 0, result.returncode
        PY
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.WHISTLE == 'true'
      with:
        retention-days: 14
        name: whistle-universal-bundle
        path: |
          build/whistle-*
          build/export-sandbox*
    - name: Signed Parakeet Debug runtime, OS network denial, active Remove and invalid-model fallback
      if: env.PARAKEET == 'true'
      run: |
        rm -rf build/Build/Products/Debug/Cassini.app
        ditto "$RUNNER_TEMP/clean-Debug-Cassini.app" build/Build/Products/Debug/Cassini.app
        mkdir -p build/parakeet-app-reports
        codesign --force --sign - --options 0 --timestamp=none --entitlements Cassini/Cassini.entitlements build/Build/Products/Debug/Cassini.app
        python3 scripts/check-parakeet-bundle.py build/Build/Products/Debug/Cassini.app
        python3 scripts/test-model-network-app.py build/Build/Products/Debug/Cassini.app --output build/parakeet-app-reports/network.json
        python3 scripts/test-parakeet-app.py build/Build/Products/Debug/Cassini.app --model "$CASSINI_PARAKEET_MODEL" --report build/parakeet-app-reports/app.json
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.PARAKEET == 'true'
      with:
        retention-days: 14
        name: parakeet-macos-15
        path: build/parakeet-app-reports
    - name: Scoped XPC registration and production setup service
      if: env.BROWSER_SETUP == 'true'
      run: |
        rm -rf build/Build/Products/Debug/Cassini.app
        ditto "$RUNNER_TEMP/clean-Debug-Cassini.app" build/Build/Products/Debug/Cassini.app
        python3 scripts/test-browser-setup-spike.py --skip-build --output build/browser-setup-report.json
        python3 scripts/test-browser-connect.py --skip-build --app build/Build/Products/Debug/Cassini.app --output build/browser-connect-report.json
    - uses: actions/setup-node@v4
      if: env.BROWSER_SETUP == 'true'
      with:
        node-version: '22'
    - name: Install pinned Chromium and follow the real Add from Cassini guide
      if: env.BROWSER_SETUP == 'true'
      run: |
        npm ci --prefix BrowserExtension/tests
        BrowserExtension/tests/node_modules/.bin/playwright install chromium
        command -v displayplacer >/dev/null || brew install displayplacer
        python3 scripts/hosted-display.py
        python3 scripts/test-local-companion.py build/Build/Products/Debug/Cassini.app --output build/local-companion
    - name: Installed app connects to fresh browser without a click
      id: browser_background
      if: env.BROWSER_SETUP == 'true'
      run: node scripts/test-browser-background.mjs build/Build/Products/Debug/Cassini.app build/browser-background-report.json
    - name: Product app capture ownership without devices
      if: ${{ !cancelled() && env.BROWSER_SETUP == 'true' && steps.browser_background.outcome == 'success' }}
      run: python3 scripts/test-browser-capture-app.py build/Build/Products/Debug/Cassini.app --output build/browser-capture-app.json
    - name: Real Chromium navigation and app-owned source restoration
      if: ${{ !cancelled() && env.BROWSER_SETUP == 'true' && steps.browser_background.outcome == 'success' }}
      run: |
        node --test scripts/test-wait-for-change.mjs
        node scripts/test-browser-return.mjs build/Build/Products/Debug/Cassini.app build/browser-return-report.json
    - name: Shared test 2, live folder (protocol driver and oracle on the real app)
      if: ${{ !cancelled() && env.BROWSER_SETUP == 'true' && steps.browser_background.outcome == 'success' }}
      timeout-minutes: 8
      run: node scripts/test-live-folder.mjs build/Build/Products/Debug/Cassini.app build/live-folder
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always() && env.BROWSER_SETUP == 'true'
      with:
        retention-days: 14
        name: browser-setup-macos-15
        path: |
          build/browser-setup-report.json
          build/browser-setup-report.stderr.txt
          build/browser-connect-report.json
          build/browser-connect-report.stderr.txt
          build/browser-background-report.json
          build/browser-background-report.json.stderr.txt
          build/browser-return-report.json
          build/browser-return-report.json.stderr.txt
          build/browser-return-report.json.stdout.txt
          build/browser-return-report.json.extension.json
          build/browser-capture-app.json
