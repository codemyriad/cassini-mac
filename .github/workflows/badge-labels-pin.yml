name: Standalone badge label pin
on:
  pull_request:
    paths: [Components/BadgeLabels/**, scripts/check-badge-labels-pin.py, scripts/test-badge-labels-pin.py, .github/workflows/badge-labels-pin.yml]
  push:
    branches: [main]
    paths: [Components/BadgeLabels/**, scripts/check-badge-labels-pin.py, scripts/test-badge-labels-pin.py, .github/workflows/badge-labels-pin.yml]
permissions:
  contents: read
jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-badge-labels-pin.py
      - run: python3 scripts/test-badge-labels-pin.py
