name: UX Library model
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  library:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      TZ: UTC
      LANG: C
      CASSINI_LIBRARY_RESULTS: ux-library-vector-results
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Golden vectors and read-only Library tests
      run: |
        set -o pipefail
        swift test --skip-build --filter 'Library|SearchTests' 2>&1 | tee ux-library-tests.log
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: ux-library-test-results
        path: |
          ux-library-tests.log
          ux-library-vector-results
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
    name: Library model
