name: Whistle bundle
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  worker:
    name: Whistle worker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-15
          arch: arm64
        - runner: macos-15-intel
          arch: x86_64
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER || matrix.runner }}
    timeout-minutes: 20
    env:
      CASSINI_CI_ARCH: ${{ matrix.arch }}
    # On a rented Apple Silicon Mac the Intel row runs its x86_64 products through Rosetta 2;
    # on a machine of that architecture `arch` changes nothing.
    defaults:
      run:
        shell: arch -${{ matrix.arch }} /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        swiftpm: 'true'
        assets: 'true'
    - run: test "$GITHUB_ACTIONS" = true && { test "$RUNNER_ENVIRONMENT" = github-hosted || test "$RUNNER_ENVIRONMENT" = self-hosted; }
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    # A rented Mac's own python3 may be arm64 only. The Intel row uses the selected Xcode's
    # universal Python, which runs as x86_64 under `arch -x86_64`.
    - name: Use the selected Xcode's universal Python for the Intel row on a rented Mac
      if: runner.environment != 'github-hosted' && matrix.arch == 'x86_64'
      run: |
        mkdir -p "$RUNNER_TEMP/python"
        ln -sf "$(xcrun -f python3)" "$RUNNER_TEMP/python/python3"
        echo "$RUNNER_TEMP/python" >> "$GITHUB_PATH"
    # The interpreter compiles and loads the constructor fixture below, so it has the
    # architecture of the worker it tests.
    - run: test "$(python3 -c 'import platform; print(platform.machine())')" = "$CASSINI_CI_ARCH"
    - name: Build worker and Whistle regressions
      run: |
        swift test --skip-build --filter Whistle
        python3 scripts/test-worker-events.py
    - name: Recover corrupt or truncated artifact caches
      run: python3 scripts/test-whistle-fetch.py
    - name: Verified model memory and process ownership
      env:
        CASSINI_WHISTLE_TEST_ASSETS: ${{ github.workspace }}/build/Whistle
        NEEDLE_TELEMETRY: '0'
        DO_NOT_TRACK: '1'
        ORT_DISABLE_TELEMETRY: '1'
      run: swift test --skip-build --filter WhistleAssetIntegrationTests
    - name: Shared FIR, segmentation and strict Whistle goldens
      env:
        CASSINI_PIPELINE_ASSETS: ${{ github.workspace }}/build/Whistle
        CASSINI_PIPELINE_REPORT_DIR: ${{ github.workspace }}/build/pipeline
        NEEDLE_TELEMETRY: '0'
        DO_NOT_TRACK: '1'
        ORT_DISABLE_TELEMETRY: '1'
      run: swift test --skip-build --filter 'PipelineTests|TranscriptionMeetingTests'
    - name: Constructor privacy guard and persistent worker JFK golden
      run: python3 scripts/test-whistle-worker.py --worker .build/debug/cassini-whistle-worker --bundle build/Whistle
        --report build/whistle-${{ matrix.runner }}.json
    - name: Preserve worker crash diagnostics
      if: failure()
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import shutil, time
        time.sleep(2)
        output = Path('build/whistle-crashes'); output.mkdir(parents=True,exist_ok=True)
        for report in (Path.home()/'Library/Logs/DiagnosticReports').glob('cassini-whistle-worker*'):
            if report.is_file(): shutil.copy2(report,output/report.name)
        PY
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: whistle-${{ matrix.runner }}
        path: |
          build/pipeline
          build/whistle-*
          build/export-sandbox*.json
          build/Whistle/unsigned-sha256.json
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
  bundle:
    name: Universal app and sandboxed Whistle helper
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
    - run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - name: Verify universal app with signed engine and inheriting helper
      run: |
        codesign --force --sign - --entitlements Cassini/Cassini.entitlements build/Build/Products/Debug/Cassini.app
        codesign --verify --deep --strict build/Build/Products/Debug/Cassini.app
    - name: Verify sealed Opus encoder and sandbox export round trip
      run: python3 scripts/test-export-sandbox.py build/Build/Products/Debug/Cassini.app --output build/export-sandbox.json
    - name: Verify packaged app starts its sandbox-inheriting worker
      env:
        CASSINI_HOSTED_WHISTLE: '1'
      run: |
        python3 scripts/check-whistle-bundle.py build/Build/Products/Debug/Cassini.app
        python3 - <<'PY'
        import os,subprocess
        from pathlib import Path
        result=subprocess.run(['build/Build/Products/Debug/Cassini.app/Contents/MacOS/Cassini','--whistle-self-test'],env=os.environ,capture_output=True,text=True,timeout=60)
        Path('build/whistle-sandbox.json').write_text(result.stdout)
        Path('build/whistle-sandbox-stderr.txt').write_text(result.stderr)
        print(result.stdout);print(result.stderr)
        assert result.returncode==0,result.returncode
        PY
    - uses: actions/upload-artifact@v5
      continue-on-error: true
      if: always()
      with:
        retention-days: 14
        name: whistle-universal-bundle
        path: |
          build/whistle-*
          build/export-sandbox*
          build/Build/Products/Debug/Cassini.app/Contents/Resources/Whistle/bundle-sha256.json
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
