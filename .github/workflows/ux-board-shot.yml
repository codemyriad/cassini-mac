name: UX board-size screenshot spike
'on':
  workflow_call:
    inputs:
      products_ready:
        type: boolean
        default: false
        description: Caller already produced same-run build artifacts
  workflow_dispatch: null
jobs:
  build:
    if: ${{ !inputs.products_ready }}
    uses: ./.github/workflows/ci-build.yml
  board-screenshots:
    name: Board-size capture ${{ matrix.attempt }}
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt:
        - 1
        - 2
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/ci-products
      with:
        debug: 'true'
    - name: Require GitHub-hosted runner
      run: test "$RUNNER_ENVIRONMENT" = github-hosted
    - name: Install capture tools
      run: brew install displayplacer
    - name: Select and verify a larger display mode
      run: |
        set -o pipefail
        mkdir -p build
        system_profiler SPDisplaysDataType > build/display-system.txt
        python3 scripts/hosted-display.py 2>&1 | tee build/display-mode.log
    - name: Capture 1120 by 720 windows and sheet
      env:
        TEST_RUNNER_CASSINI_HOSTED_SCREENSHOTS: '1'
        TEST_RUNNER_CASSINI_SCREENSHOT_SIZE: 1120x720
      run: |
        set -o pipefail
        xcodebuild test-without-building -xctestrun "$(find build/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)" -destination 'platform=macOS' -parallel-testing-enabled NO \
          -resultBundlePath build/BoardScreenshots.xcresult \
          2>&1 | tee build/window-tests.log
    - name: Export window PNGs
      if: always()
      run: |
        if test -d build/BoardScreenshots.xcresult; then
          xcrun xcresulttool export attachments --path build/BoardScreenshots.xcresult \
            --output-path build/window-screenshots
        fi
    - name: Require exact board-size PNGs
      run: python3 scripts/check-window-screenshots.py build/window-screenshots 1120x720
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: board-screenshots-${{ matrix.attempt }}-${{ github.sha }}
        path: |
          build/window-screenshots/*.png
          build/window-screenshots/manifest.json
          build/window-tests.log
          build/display-*
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: board-screenshot-diagnostics-${{ matrix.attempt }}-${{ github.sha }}
        path: build/BoardScreenshots.xcresult
        if-no-files-found: ignore
    needs:
    - build
    if: ${{ always() && !cancelled() && (inputs.products_ready || needs.build.result == 'success') }}
