name: Restore same-run products
description: Verify source, pins, architecture and Xcode before extracting signed products.
inputs:
  headless:
    default: 'false'
    description: Separate same-toolchain rented-runner products; never GUI or Release products
  swiftpm:
    default: 'false'
    description: Native SwiftPM test bundles and executables
  assets:
    default: 'false'
    description: Universal pinned offline engines and models
  parakeet:
    default: 'false'
    description: Optional Parakeet runtime and golden model, never included in shipped products
  runtime:
    default: 'false'
    description: Pinned Parakeet runtime alone, without the optional model
  debug:
    default: 'false'
    description: Universal signed app and UI tests
  release:
    default: 'false'
    description: Universal signed Release app
runs:
  using: composite
  steps:
    - if: inputs.headless == 'true'
      shell: bash
      env:
        RESTORE_RELEASE: ${{ inputs.release }}
      run: |
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RESTORE_RELEASE" != true
    - shell: bash
      run: bash scripts/ci-select-xcode.sh
    - id: arch
      shell: bash
      run: echo "name=$(uname -m)" >> "$GITHUB_OUTPUT"
    # D66 mac-P0-4 (rule 2): every download is strict (download-artifact retries the service
    # itself and logs it). A product that arrives incomplete (missing or truncated archive,
    # ci-products.py exit 75) is downloaded once more with a warning and verified again; any
    # other mismatch, or a second incomplete arrival, fails the job.
    - uses: actions/download-artifact@v5
      if: inputs.swiftpm == 'true'
      with:
        name: ci-swiftpm-${{ steps.arch.outputs.name }}${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.assets == 'true'
      with:
        name: ci-assets${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.parakeet == 'true'
      with:
        name: ci-parakeet${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.runtime == 'true'
      with:
        name: ci-runtime${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.debug == 'true'
      with:
        name: ci-debug${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.release == 'true'
      with:
        name: ci-release
        path: build/ci-products
    - id: verify
      shell: bash
      env:
        RESTORE_SWIFTPM: ${{ inputs.swiftpm }}
        RESTORE_ASSETS: ${{ inputs.assets }}
        RESTORE_PARAKEET: ${{ inputs.parakeet }}
        RESTORE_RUNTIME: ${{ inputs.runtime }}
        RESTORE_DEBUG: ${{ inputs.debug }}
        RESTORE_RELEASE: ${{ inputs.release }}
      run: |
        retry=" "
        for kind in swiftpm assets parakeet runtime debug release; do
          flag="RESTORE_$(echo "$kind" | tr '[:lower:]' '[:upper:]')"
          [ "${!flag}" = true ] || continue
          status=0; python3 scripts/ci-products.py unpack "$kind" build/ci-products || status=$?
          if [ "$status" -eq 75 ]; then
            echo "::warning::CI product $kind arrived incomplete; downloading it once more"
            rm -f "build/ci-products/$kind.json" "build/ci-products/$kind.tar.gz"; retry="$retry$kind "
          elif [ "$status" -ne 0 ]; then exit "$status"; fi
        done
        echo "retry=$retry" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v5
      if: inputs.swiftpm == 'true' && contains(steps.verify.outputs.retry, ' swiftpm ')
      with:
        name: ci-swiftpm-${{ steps.arch.outputs.name }}${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.assets == 'true' && contains(steps.verify.outputs.retry, ' assets ')
      with:
        name: ci-assets${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.parakeet == 'true' && contains(steps.verify.outputs.retry, ' parakeet ')
      with:
        name: ci-parakeet${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.runtime == 'true' && contains(steps.verify.outputs.retry, ' runtime ')
      with:
        name: ci-runtime${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.debug == 'true' && contains(steps.verify.outputs.retry, ' debug ')
      with:
        name: ci-debug${{ inputs.headless == 'true' && '-headless' || '' }}
        path: build/ci-products
    - uses: actions/download-artifact@v5
      if: inputs.release == 'true' && contains(steps.verify.outputs.retry, ' release ')
      with:
        name: ci-release
        path: build/ci-products
    - if: steps.verify.outputs.retry != ' '
      shell: bash
      env:
        RETRY: ${{ steps.verify.outputs.retry }}
      run: |
        for kind in $RETRY; do python3 scripts/ci-products.py unpack "$kind" build/ci-products; done
